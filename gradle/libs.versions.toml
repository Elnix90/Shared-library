[versions]
agp = "9.4.1"

kotlin = "2.4.21"
androidx-core = "1.19.1"
androidx-annotation = "1.11.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
material3 = "1.5.0-beta02"
ui = "1.12.1"
graphicsShapes = "1.1.0"
runtimeRetain = "1.12.1"
kotlinx-coroutines = "1.11.0"

junit = "4.13.2"
junitExt = "1.3.0"

uiTooling = "1.12.1"

# https://github.com/vanniktech/gradle-maven-publish-plugin
vanniktech-maven = "0.37.0"

# https://github.com/autonomousapps/dependency-analysis-android-gradle-plugin
dependency-analysis = "3.19.2"

[libraries]
androidx-compose-animation = { module = "androidx.compose.animation:animation", version.ref = "ui" }
androidx-compose-animation-core = { module = "androidx.compose.animation:animation-core", version.ref = "ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "ui" }
androidx-compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout", version.ref = "ui" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "ui" }
androidx-compose-runtime-annotation = { module = "androidx.compose.runtime:runtime-annotation", version.ref = "ui" }
androidx-compose-runtime-retain = { module = "androidx.compose.runtime:runtime-retain", version.ref = "runtimeRetain" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "ui" }
androidx-compose-ui-geometry = { module = "androidx.compose.ui:ui-geometry", version.ref = "ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "ui" }
androidx-compose-ui-text = { module = "androidx.compose.ui:ui-text", version.ref = "ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "uiTooling" }
androidx-compose-ui-unit = { module = "androidx.compose.ui:ui-unit", version.ref = "ui" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx-core" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activityCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Instrumented test dependencies
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test", version.ref = "ui" }

# Dependencies of the build-logic (convention plugins) itself. Referenced from build-logic/build.gradle.kts.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
dependency-analysis-plugin = { module = "com.autonomousapps.dependency-analysis:com.autonomousapps.dependency-analysis.gradle.plugin", version.ref = "dependency-analysis" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }


[plugins]
shared-library = { id = "shared.library" }
shared-compose = { id = "shared.compose" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven" }
